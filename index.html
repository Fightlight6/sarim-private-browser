<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivaBrowser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
    
    /* Address Bar Styling */
    .nav-bar { display: flex; gap: 8px; padding: 10px; background: #1f1f1f; border-bottom: 1px solid #333; }
    .btn { background: #008080; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #00a0a0; }
    input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #444; background: #0a0a0a; color: white; outline: none; font-size: 14px; }
    input:focus { border-color: #008080; }
    
    /* Browser Display Frame */
    iframe { flex: 1; border: none; background: white; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="btn" onclick="goHome()">🏠 Home</button>
    <input type="text" id="addressInput" placeholder="Type a website (e.g., wikipedia.org) or search term..." onkeydown="if(event.key==='Enter') navigate()">
    <button class="btn" onclick="navigate()">Go</button>
  </div>

  <iframe id="browserFrame" src="https://duckduckgo.com/html"></iframe>

  <script>
    const frame = document.getElementById('browserFrame');
    const input = document.getElementById('addressInput');

    function navigate() {
      let query = input.value.trim();
      if (!query) return;

      // Detect if user typed a website link (like reddit.com or wikipedia.org)
      const isWebsite = query.startsWith('http://') || 
                        query.startsWith('https://') || 
                        (query.includes('.') && !query.includes(' '));

      if (isWebsite) {
        if (!query.startsWith('http://') && !query.startsWith('https://')) {
          query = 'https://' + query;
        }
        
        // Route website through Google's cloud server engine to bypass school blocks
        frame.src = 'https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(query);
      } else {
        // Search using DuckDuckGo
        frame.src = 'https://duckduckgo.com/html/?q=' + encodeURIComponent(query);
      }
    }

    function goHome() {
      input.value = '';
      frame.src = 'https://duckduckgo.com/html';
    }
  </script>
</body>
</html>
