<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cloud Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #202124; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Top Navigation Bar */
    .nav-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #2f3136; border-bottom: 1px solid #3c4043; }
    .btn { background: #1a73e8; color: white; border: none; padding: 9px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #1557b0; }
    
    .url-input { flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid #5f6368; background: #171717; color: #fff; font-size: 14px; outline: none; }
    .url-input:focus { border-color: #8ab4f8; }

    /* Display Area */
    .container { flex: 1; position: relative; width: 100%; height: 100%; }
    
    /* Google Native Search Section */
    #searchSection { padding: 20px; height: 100%; overflow-y: auto; background: #202124; }
    .google-header { text-align: center; margin: 20px 0; }
    .google-header h1 { font-size: 2.2rem; color: #8ab4f8; margin-bottom: 8px; }
    .google-header p { color: #bdc1c6; }

    /* Embedded Site Frame */
    #webFrame { width: 100%; height: 100%; border: none; background: #fff; display: none; }

    /* Style Google Search Widget to fit Dark Mode */
    .gsc-control-cse { background-color: #202124 !important; border: none !important; }
    .gsc-search-button-v2 { background-color: #1a73e8 !important; border-radius: 6px !important; }
  </style>

  <!-- Google Official Embeddable Search Code -->
  <script src="https://cse.google.com/cse.js?cx=c020588147d3443a7" async></script>
</head>
<body>

  <!-- Top Navigation Controls -->
  <div class="nav-bar">
    <button class="btn" onclick="showSearch()">🏠 Search Home</button>
    <input type="text" id="addressBar" class="url-input" placeholder="Type a website domain (e.g. wikipedia.org) or search Google..." onkeydown="if(event.key==='Enter') handleGo()">
    <button class="btn" onclick="handleGo()">Go</button>
  </div>

  <div class="container">
    <!-- Website Frame -->
    <iframe id="webFrame"></iframe>

    <!-- Google Search Engine -->
    <div id="searchSection">
      <div class="google-header">
        <h1>🔍 Google Cloud Search</h1>
        <p>Type a search query below or enter a website address above.</p>
      </div>
      
      <!-- Official Google Search Widget -->
      <div class="gcse-search"></div>
    </div>
  </div>

  <script>
    const frame = document.getElementById('webFrame');
    const searchSection = document.getElementById('searchSection');
    const addressBar = document.getElementById('addressBar');

    function handleGo() {
      const val = addressBar.value.trim();
      if (!val) return;

      // Check if user typed a direct website link (like wikipedia.org, example.com)
      const isUrl = val.startsWith('http://') || 
                    val.startsWith('https://') || 
                    (val.includes('.') && !val.includes(' '));

      if (isUrl) {
        let target = val;
        if (!target.startsWith('http://') && !target.startsWith('https://')) {
          target = 'https://' + target;
        }
        searchSection.style.display = 'none';
        frame.style.display = 'block';
        frame.src = target;
      } else {
        // Trigger Google Search Widget
        showSearch();
        setTimeout(() => {
          const ginput = document.querySelector('input.gsc-input');
          const gbtn = document.querySelector('button.gsc-search-button-v2');
          if (ginput && gbtn) {
            ginput.value = val;
            gbtn.click();
          }
        }, 300);
      }
    }

    function showSearch() {
      frame.style.display = 'none';
      searchSection.style.display = 'block';
    }
  </script>
</body>
</html>
