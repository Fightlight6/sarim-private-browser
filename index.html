<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivaBrowser & Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #181818; color: #fff; overflow: hidden; }

    /* Top Navigation Bar */
    .navbar { display: flex; align-items: center; gap: 8px; padding: 10px; background-color: #242424; border-bottom: 1px solid #333; }
    .nav-btn { background: #333; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-btn:hover { background: #444; }
    
    .url-input { flex-grow: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid #444; background: #121212; color: #fff; font-size: 14px; outline: none; }
    .url-input:focus { border-color: #008080; }

    /* Main Display Area */
    .viewport { flex-grow: 1; position: relative; width: 100%; height: 100%; }

    /* 1. Embedded Web View (For direct websites) */
    iframe { width: 100%; height: 100%; border: none; background: #fff; display: none; }

    /* 2. Custom Search Engine View (For search queries) */
    .search-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; background: #121212; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    .results-container { width: 100%; max-width: 750px; margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
    .result-card { background: #1e1e1e; padding: 16px; border-radius: 8px; border: 1px solid #2d2d2d; }
    .result-card h3 a { color: #58a6ff; text-decoration: none; font-size: 1.1rem; }
    .result-card h3 a:hover { text-decoration: underline; }
    .result-card .url-text { color: #8b949e; font-size: 0.8rem; margin-bottom: 6px; display: block; }
    .result-card .snippet { color: #c9d1d9; font-size: 0.9rem; line-height: 1.4; }
    .badge { background: #008080; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
  </style>
</head>
<body>

  <!-- Browser Controls -->
  <div class="navbar">
    <button class="nav-btn" onclick="showHome()">🏠 Home</button>
    <input type="text" id="addressBar" class="url-input" placeholder="Type a URL (e.g. wikipedia.org) or search term..." onkeydown="if(event.key==='Enter') navigate()">
    <button class="nav-btn" onclick="navigate()">Go</button>
  </div>

  <!-- Viewport Area -->
  <div class="viewport">
    
    <!-- Website Frame -->
    <iframe id="webFrame"></iframe>

    <!-- Search Engine View -->
    <div id="searchView" class="search-view">
      <h2 style="margin-top: 40px; color: #008080;">🔒 PrivaBrowser Engine</h2>
      <p style="color: #888; margin-bottom: 20px;">Type a website domain above to open it, or type anything to search.</p>
      <div id="searchResults" class="results-container"></div>
    </div>

  </div>

  <script>
    const frame = document.getElementById('webFrame');
    const searchView = document.getElementById('searchView');
    const searchResults = document.getElementById('searchResults');
    const addressBar = document.getElementById('addressBar');

    function navigate() {
      const input = addressBar.value.trim();
      if (!input) return;

      // Check if user input is a website link (contains domain extension like .com, .org, .io, .net)
      const isWebsite = input.startsWith('http://') || 
                        input.startsWith('https://') || 
                        (input.includes('.') && !input.includes(' '));

      if (isWebsite) {
        // Open site inside the browser frame
        let targetUrl = input;
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
        }
        
        searchView.style.display = 'none';
        frame.style.display = 'block';
        frame.src = targetUrl;
      } else {
        // Run private search
        frame.style.display = 'none';
        searchView.style.display = 'flex';
        executePrivateSearch(input);
      }
    }

    async function executePrivateSearch(query) {
      searchResults.innerHTML = '<p style="text-align:center; color:#888;">Searching web anonymously...</p>';
      let html = '';

      try {
        // Fetch Instant Answer & Websites from DuckDuckGo API
        const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&origin=*`);
        const data = await response.json();

        if (data.AbstractURL) {
          html += `
            <div class="result-card">
              <span class="badge">Top Result</span>
              <span class="url-text">${data.AbstractURL}</span>
              <h3><a href="#" onclick="openSite('${data.AbstractURL}')">${data.Heading}</a></h3>
              <p class="snippet">${data.AbstractText}</p>
            </div>`;
        }

        // Fetch related topics/links
        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          data.RelatedTopics.slice(0, 8).forEach(item => {
            if (item.FirstURL && item.Text) {
              html += `
                <div class="result-card">
                  <span class="url-text">${item.FirstURL}</span>
                  <h3><a href="#" onclick="openSite('${item.FirstURL}')">${item.Text.split(' - ')[0]}</a></h3>
                  <p class="snippet">${item.Text}</p>
                </div>`;
            }
          });
        }

        // Fetch Wikipedia Articles
        const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=5&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*`);
        const wikiData = await wikiRes.json();

        if (wikiData.query && wikiData.query.pages) {
          Object.values(wikiData.query.pages).forEach(page => {
            const pageUrl = `https://en.wikipedia.org/?curid=${page.pageid}`;
            html += `
              <div class="result-card">
                <span class="badge">Wikipedia</span>
                <span class="url-text">${pageUrl}</span>
                <h3><a href="#" onclick="openSite('${pageUrl}')">${page.title}</a></h3>
                <p class="snippet">${page.extract || ''}</p>
              </div>`;
          });
        }

        if (!html) html = '<p style="text-align:center; color:#888;">No results found. Try searching a specific domain name.</p>';

      } catch (err) {
        html = '<p style="text-align:center; color:#ff6b6b;">Failed to fetch results. Check your connection.</p>';
      }

      searchResults.innerHTML = html;
    }

    function openSite(url) {
      addressBar.value = url;
      searchView.style.display = 'none';
      frame.style.display = 'block';
      frame.src = url;
    }

    function showHome() {
      frame.style.display = 'none';
      searchView.style.display = 'flex';
      searchResults.innerHTML = '';
      addressBar.value = '';
    }
  </script>
</body>
</html>
