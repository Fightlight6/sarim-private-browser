<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cloud Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #202124; color: #fff; }
    
    /* Address Bar Styling */
    .nav-bar { display: flex; gap: 8px; padding: 10px; background: #2f3136; border-bottom: 1px solid #444; align-items: center; }
    .btn { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn:hover { background: #1557b0; }
    input { flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid #5f6368; background: #171717; color: white; outline: none; font-size: 14px; }
    input:focus { border-color: #8ab4f8; }
    
    /* Browser Frame */
    iframe { flex: 1; border: none; background: white; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="btn" onclick="goHome()">🏠 Google Home</button>
    <input type="text" id="addressInput" placeholder="Type a website (e.g. wikipedia.org) or search Google..." onkeydown="if(event.key==='Enter') navigate()">
    <button class="btn" onclick="navigate()">Search</button>
  </div>

  <!-- Loads Google inside the browser frame by default -->
  <iframe id="browserFrame" src="https://translate.google.com/translate?sl=auto&tl=en&u=https://www.google.com"></iframe>

  <script>
    const frame = document.getElementById('browserFrame');
    const input = document.getElementById('addressInput');

    function navigate() {
      let query = input.value.trim();
      if (!query) return;

      // Check if user typed a direct domain name (like wikipedia.org or example.com)
      const isWebsite = query.startsWith('http://') || 
                        query.startsWith('https://') || 
                        (query.includes('.') && !query.includes(' '));

      if (isWebsite) {
        if (!query.startsWith('http://') && !query.startsWith('https://')) {
          query = 'https://' + query;
        }
        // Load target website through Google Translate server frame
        frame.src = 'https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(query);
      } else {
        // Run Google Search directly through Google Translate server frame
        const googleSearchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        frame.src = 'https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(googleSearchUrl);
      }
    }

    function goHome() {
      input.value = '';
      frame.src = 'https://translate.google.com/translate?sl=auto&tl=en&u=https://www.google.com';
    }
  </script>
</body>
</html>
