<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cloud Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #202124; color: #e8eaed; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Navigation Bar */
    .nav-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #2f3136; border-bottom: 1px solid #3c4043; }
    .btn { background: #8ab4f8; color: #202124; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #aecbfa; }

    .url-input { flex: 1; padding: 10px 16px; border-radius: 24px; border: 1px solid #5f6368; background: #171717; color: #fff; font-size: 14px; outline: none; }
    .url-input:focus { border-color: #8ab4f8; box-shadow: 0 0 5px rgba(138, 180, 248, 0.4); }

    /* Custom Worker Bar */
    .worker-bar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: #1e1e1e; border-bottom: 1px solid #333; font-size: 12px; }
    .worker-input { flex: 1; padding: 4px 10px; border-radius: 12px; border: 1px solid #444; background: #0a0a0a; color: #8ab4f8; font-size: 11px; outline: none; }

    /* Main Container */
    .main-container { flex: 1; position: relative; width: 100%; height: 100%; }

    /* Home Interface */
    #homeSection { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; }
    .google-logo { font-size: 3.5rem; font-weight: bold; margin-bottom: 24px; letter-spacing: -1px; }
    .g-blue { color: #4285f4; }
    .g-red { color: #ea4335; }
    .g-yellow { color: #fbbc05; }
    .g-green { color: #34a853; }

    .search-box-container { width: 100%; max-width: 580px; display: flex; gap: 10px; margin-bottom: 20px; }
    .main-search-input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid #5f6368; background: #303134; color: #fff; font-size: 16px; outline: none; }
    .main-search-input:focus { border-color: #8ab4f8; background: #202124; }

    .search-btn { background: #303134; color: #e8eaed; border: 1px solid #5f6368; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .search-btn:hover { background: #3c4043; border-color: #8ab4f8; }

    .info-text { color: #bdc1c6; font-size: 0.85rem; margin-top: 15px; line-height: 1.5; max-width: 520px; }

    /* Web Display Frame */
    #browserFrame { width: 100%; height: 100%; border: none; background: #fff; display: none; }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="nav-bar">
    <button class="btn" onclick="showHome()">🏠 Home</button>
    <input type="text" id="topAddressBar" class="url-input" placeholder="Search Google or enter a website URL..." onkeydown="if(event.key==='Enter') navigateFromTop()">
    <button class="btn" onclick="navigateFromTop()">Go</button>
  </div>

  <!-- Custom Proxy Worker Entry -->
  <div class="worker-bar">
    <span style="color:#bdc1c6;">⚡ Custom Proxy (Optional):</span>
    <input type="text" id="customWorkerInput" class="worker-input" placeholder="Paste Cloudflare Worker URL here if public sites are blocked..." onchange="saveCustomWorker()">
  </div>

  <!-- Main Display -->
  <div class="main-container">
    
    <!-- Home Interface -->
    <div id="homeSection">
      <div class="google-logo">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
      </div>

      <div class="search-box-container">
        <input type="text" id="mainSearchInput" class="main-search-input" placeholder="Search Google or enter a website URL..." onkeydown="if(event.key==='Enter') navigateFromMain()">
        <button class="search-btn" onclick="navigateFromMain()">Google Search</button>
      </div>

      <p class="info-text">
        🔒 Native Google Searches work out-of-the-box. External websites use multi-engine fallback proxying.
      </p>
    </div>

    <!-- Web Display Frame -->
    <iframe id="browserFrame"></iframe>

  </div>

  <script>
    const frame = document.getElementById('browserFrame');
    const homeSection = document.getElementById('homeSection');
    const topAddressBar = document.getElementById('topAddressBar');
    const mainSearchInput = document.getElementById('mainSearchInput');
    const customWorkerInput = document.getElementById('customWorkerInput');

    // Load saved custom proxy worker if present
    if (localStorage.getItem('my_custom_worker')) {
      customWorkerInput.value = localStorage.getItem('my_custom_worker');
    }

    function saveCustomWorker() {
      localStorage.setItem('my_custom_worker', customWorkerInput.value.trim());
    }

    // Intercept clicks on links inside loaded proxy pages
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'NAVIGATE_INNER' && e.data.url) {
        loadTarget(e.data.url);
      }
    });

    function loadTarget(query) {
      if (!query) return;

      topAddressBar.value = query;

      const isUrl = query.startsWith('http://') || 
                    query.startsWith('https://') || 
                    (query.includes('.') && !query.includes(' '));

      homeSection.style.display = 'none';
      frame.style.display = 'block';

      if (isUrl) {
        let target = query;
        if (!target.startsWith('http://') && !target.startsWith('https://')) {
          target = 'https://' + target;
        }
        fetchWebSite(target);
      } else {
        // Embed Google Search directly using igu=1
        frame.removeAttribute('srcdoc');
        frame.src = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(query);
      }
    }

    async function fetchWithTimeout(url, timeoutMs = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    async function fetchWebSite(targetUrl) {
      frame.removeAttribute('src');

      frame.srcdoc = `
        <body style="background:#202124; color:#8ab4f8; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;">
          <h2 style="margin-bottom:10px;">Connecting to site...</h2>
          <p style="color:#bdc1c6; font-size:14px;">${targetUrl}</p>
        </body>`;

      let loadedHtml = null;

      // 1. Try Custom Private Worker if defined
      const customWorker = customWorkerInput.value.trim();
      if (customWorker) {
        try {
          const workerUrl = customWorker.endsWith('/') ? customWorker + targetUrl : customWorker + '?url=' + encodeURIComponent(targetUrl);
          const res = await fetchWithTimeout(workerUrl, 4000);
          if (res.ok) {
            loadedHtml = await res.text();
          }
        } catch (e) {}
      }

      // 2. Try AllOrigins JSON API
      if (!loadedHtml) {
        try {
          const res = await fetchWithTimeout('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl), 3500);
          if (res.ok) {
            const data = await res.json();
            if (data && data.contents) loadedHtml = data.contents;
          }
        } catch (e) {}
      }

      // 3. Try CodeTabs Bridge
      if (!loadedHtml) {
        try {
          const res = await fetchWithTimeout('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(targetUrl), 3500);
          if (res.ok) {
            const text = await res.text();
            if (text && text.trim().length > 0) loadedHtml = text;
          }
        } catch (e) {}
      }

      if (loadedHtml) {
        const scriptInjector = `
          <base href="${targetUrl}">
          <script>
            document.addEventListener('click', function(e) {
              const a = e.target.closest('a');
              if (a && a.href) {
                e.preventDefault();
                window.parent.postMessage({ type: 'NAVIGATE_INNER', url: a.href }, '*');
              }
            }, true);
          <\/script>
        `;

        if (loadedHtml.includes('<head>')) {
          loadedHtml = loadedHtml.replace('<head>', '<head>' + scriptInjector);
        } else {
          loadedHtml = scriptInjector + loadedHtml;
        }

        frame.srcdoc = loadedHtml;
      } else {
        frame.srcdoc = `
          <body style="background:#202124; color:#e8eaed; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; padding:20px; text-align:center;">
            <h3 style="color:#ea4335; margin-bottom:10px;">Public Proxy Blocked by Chromebook Filter</h3>
            <p style="color:#bdc1c6; max-width:480px; font-size:13px; line-height:1.6; margin-bottom:15px;">
              Your school Chromebook is blocking public CORS proxies by domain name.
            </p>
            <p style="color:#8ab4f8; font-size:12px;">
              Create a free private Cloudflare Worker (takes 60 seconds) and paste your custom URL into the top box above to bypass all Chromebook blocks permanently.
            </p>
          </body>`;
      }
    }

    function navigateFromTop() {
      loadTarget(topAddressBar.value.trim());
    }

    function navigateFromMain() {
      loadTarget(mainSearchInput.value.trim());
    }

    function showHome() {
      frame.style.display = 'none';
      homeSection.style.display = 'flex';
      topAddressBar.value = '';
      mainSearchInput.value = '';
      frame.removeAttribute('src');
      frame.removeAttribute('srcdoc');
    }
  </script>
</body>
</html>
