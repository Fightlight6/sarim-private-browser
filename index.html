<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cloud Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #202124; color: #e8eaed; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Navigation Bar */
    .nav-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #2f3136; border-bottom: 1px solid #3c4043; }
    .btn { background: #8ab4f8; color: #202124; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #aecbfa; }

    .url-input { flex: 1; padding: 10px 16px; border-radius: 24px; border: 1px solid #5f6368; background: #171717; color: #fff; font-size: 14px; outline: none; }
    .url-input:focus { border-color: #8ab4f8; box-shadow: 0 0 5px rgba(138, 180, 248, 0.4); }

    /* Main Container */
    .main-container { flex: 1; position: relative; width: 100%; height: 100%; }

    /* Home Interface */
    #homeSection { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; }
    .google-logo { font-size: 3.5rem; font-weight: bold; margin-bottom: 24px; letter-spacing: -1px; }
    .g-blue { color: #4285f4; }
    .g-red { color: #ea4335; }
    .g-yellow { color: #fbbc05; }
    .g-green { color: #34a853; }

    .search-box-container { width: 100%; max-width: 580px; display: flex; gap: 10px; margin-bottom: 20px; }
    .main-search-input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid #5f6368; background: #303134; color: #fff; font-size: 16px; outline: none; }
    .main-search-input:focus { border-color: #8ab4f8; background: #202124; }

    .search-btn { background: #303134; color: #e8eaed; border: 1px solid #5f6368; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .search-btn:hover { background: #3c4043; border-color: #8ab4f8; }

    .status-msg { color: #8ab4f8; font-size: 0.9rem; margin-top: 10px; min-height: 20px; }

    /* Embedded Web Display Frame */
    #browserFrame { width: 100%; height: 100%; border: none; background: #fff; display: none; }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="nav-bar">
    <button class="btn" onclick="showHome()">🏠 Home</button>
    <input type="text" id="topAddressBar" class="url-input" placeholder="Search Google or enter website domain..." onkeydown="if(event.key==='Enter') processInput(topAddressBar.value)">
    <button class="btn" onclick="processInput(topAddressBar.value)">Go</button>
  </div>

  <!-- Main View Area -->
  <div class="main-container">
    
    <!-- Home Interface -->
    <div id="homeSection">
      <div class="google-logo">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
      </div>

      <div class="search-box-container">
        <input type="text" id="mainSearchInput" class="main-search-input" placeholder="Search Google or enter a website..." onkeydown="if(event.key==='Enter') processInput(mainSearchInput.value)">
        <button class="search-btn" onclick="processInput(mainSearchInput.value)">Google Search</button>
      </div>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- Embedded Web Frame -->
    <iframe id="browserFrame"></iframe>

  </div>

  <script>
    const frame = document.getElementById('browserFrame');
    const homeSection = document.getElementById('homeSection');
    const topAddressBar = document.getElementById('topAddressBar');
    const mainSearchInput = document.getElementById('mainSearchInput');
    const statusMsg = document.getElementById('statusMsg');

    // Intercept link clicks from inside the iframe to keep browsing inside your site
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'EMBED_NAVIGATE') {
        processInput(event.data.url);
      }
    });

    async function processInput(query) {
      query = query.trim();
      if (!query) return;

      topAddressBar.value = query;
      mainSearchInput.value = query;

      const isUrl = query.startsWith('http://') || 
                    query.startsWith('https://') || 
                    (query.includes('.') && !query.includes(' '));

      if (isUrl) {
        let target = query;
        if (!target.startsWith('http://') && !target.startsWith('https://')) {
          target = 'https://' + target;
        }
        await loadWebpageInsideFrame(target);
      } else {
        // Embed Google Search directly in the frame
        const googleSearchUrl = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(query);
        homeSection.style.display = 'none';
        frame.removeAttribute('srcdoc');
        frame.style.display = 'block';
        frame.src = googleSearchUrl;
      }
    }

    async function loadWebpageInsideFrame(targetUrl) {
      statusMsg.textContent = 'Fetching page content & rendering in frame...';
      
      try {
        // Fetch raw website HTML through proxy
        const proxyEndpoint = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
        const response = await fetch(proxyEndpoint);
        
        if (!response.ok) throw new Error('Network response was not ok');
        let html = await response.text();

        // Script injected into target page to route internal links back into your frame
        const clickInterceptor = `
          <script>
            document.addEventListener('click', function(e) {
              const a = e.target.closest('a');
              if (a && a.href) {
                e.preventDefault();
                window.parent.postMessage({ type: 'EMBED_NAVIGATE', url: a.href }, '*');
              }
            }, true);
          <\/script>
        `;

        // Inject <base> tag so relative styles, images, and fonts load correctly
        const baseTag = `<base href="${targetUrl}">` + clickInterceptor;
        if (html.includes('<head>')) {
          html = html.replace('<head>', '<head>' + baseTag);
        } else {
          html = baseTag + html;
        }

        // Render raw HTML using srcdoc (completely bypasses X-Frame-Options)
        homeSection.style.display = 'none';
        frame.removeAttribute('src');
        frame.style.display = 'block';
        frame.srcdoc = html;
        statusMsg.textContent = '';

      } catch (err) {
        statusMsg.textContent = 'Primary proxy busy, trying secondary proxy...';
        try {
          const fallbackEndpoint = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
          const response = await fetch(fallbackEndpoint);
          let html = await response.text();
          
          const baseTag = `<base href="${targetUrl}">`;
          if (html.includes('<head>')) {
            html = html.replace('<head>', '<head>' + baseTag);
          } else {
            html = baseTag + html;
          }

          homeSection.style.display = 'none';
          frame.removeAttribute('src');
          frame.style.display = 'block';
          frame.srcdoc = html;
          statusMsg.textContent = '';
        } catch (err2) {
          alert('Failed to load page content into frame.');
          statusMsg.textContent = '';
        }
      }
    }

    function showHome() {
      frame.style.display = 'none';
      homeSection.style.display = 'flex';
      topAddressBar.value = '';
      mainSearchInput.value = '';
      frame.src = '';
      frame.removeAttribute('srcdoc');
      statusMsg.textContent = '';
    }
  </script>
</body>
</html>
